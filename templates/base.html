<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi Proyecto</title>
        {% load static %}
        <link rel="stylesheet" href="{% static 'products/css/estilo.css' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    
{% block header %}
<header class="bg-white">
    <div class="container d-flex justify-content-between align-items-center py-3">
  
        <form method="GET" action="{% url 'buscar_producto' %}" class="d-flex" aria-label="Formulario de búsqueda">
            <input class="form-control form-control-sm" type="text" name="buscar" placeholder="Buscar" aria-label="Buscar producto">
        </form>
        
      
      
        <a href="{% url 'basket:basket_summary' %}" class="btn btn-outline-secondary position-relative carrito">
            
            {% with total_qty=basket|length %}
            <div id="basket-qty" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                {% if total_qty > 0 %}
                {{ total_qty }}
                {% else %}
                0
                {% endif %}
            </div>
            {% endwith %}
            <i class="bi bi-bag-fill" style="font-size: 24px;"></i>
        </a>
    </div>
</header>
{% endblock %}
{% block content%}
{% endblock %}
