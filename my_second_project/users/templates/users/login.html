{% extends "base.html" %}
{% load tailwind_filters %}
{% block content %}
<h1 class="text-2xl font-bold sm:text-3xl">Quieres comprar? Registrate!</h1>
<form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="inline-block rounded-sm border border-indigo-600 px-12 py-3 text-sm font-medium text-indigo-600 hover:bg-indigo-600 hover:text-white focus:ring-3 focus:outline-hidden" type="submit">Login</button>
</form>
{% endblock content %}
