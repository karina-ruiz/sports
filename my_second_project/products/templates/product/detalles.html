{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="flex flex-col sm:flex-row bg-white shadow-lg rounded-lg overflow-hidden w-full max-w-4xl">
    <div class="flex-none w-full sm:w-1/2 relative">
      <img src="{{ detalle.photo.url }}" alt="{{ detalle.name }}" class="w-full h-full object-cover" aria-label="Imagen de {{ detalle.name }}">
    </div>
    <form class="flex-auto p-6">
      <div class="flex flex-wrap">
        <h1 class="flex-auto text-lg font-semibold text-slate-900">
          {{ detalle.name }}
        </h1>
        <div class="text-lg font-semibold text-slate-500">
          ${{ detalle.price }}
        </div>
        <div class="w-full flex-none text-sm font-medium text-slate-700 mt-2">
          {{ detalle.detail }}
        </div>
      </div>
      <div class="flex items-baseline mt-4 mb-6 pb-6 border-b border-slate-200">
      </div>
      <label for="select-{{ detalle.id }}" class="block text-sm text-gray-700">Cantidad</label>
      <select id="select-{{ detalle.id }}" class="w-full mt-2 p-2 border border-gray-300 rounded-md">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
      <button type="button" class="w-full mt-4 rounded bg-black p-4 text-white font-medium transition hover:scale-105" data-product-id="{{ detalle.id }}">
        Agregar al carrito
      </button>
    </form>
  </div>
</div>

<script>
  $(document).on("click", ".w-full.mt-4.rounded.bg-black", function(e) {
    e.preventDefault();
    var productId = $(this).data("product-id");  
    var productQty = $("#select-" + productId + " option:selected").val();  
    $.ajax({
      type: "POST",
      url: "{% url 'basket:basket_add' %}",
      data: {
        productid: productId,  
        productqty: productQty,  
        csrfmiddlewaretoken: "{{ csrf_token }}", 
        action: "post"
      },
      success: function(json) {
        document.getElementById("basket-qty").innerHTML = json.qty;
      },
      error: function(xhr, errmsg, err) {
        console.error(errmsg);
      }
    });       
  });
</script>

{% endblock %}
