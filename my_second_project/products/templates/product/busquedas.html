
{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-8">
    {% for product in products %}
        <div class="h-auto rounded-lg bg-gray-200 shadow-lg overflow-hidden">
            <a href="{% url 'product_detail' pk=product.id %}" class="group relative block overflow-hidden no-underline text-current hover:no-underline">
                
                <button class="absolute top-4 right-4 z-10 rounded-full bg-white p-2 text-gray-900 transition hover:text-gray-900/75">
                    <span class="sr-only">Wishlist</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/>
                    </svg>
                </button>

                {% if product.photo %}
                    <img src="{{ product.photo.url }}" alt="{{ product.name }}" class="w-full object-cover transition duration-500 group-hover:scale-105 sm:h-72 md:h-80"/>
                {% endif %}
                
                <div class="relative border border-gray-100 bg-white p-6">
                    <h3 class="mt-4 text-lg font-medium text-gray-900">{{ product.name }}</h3>
                    <p class="mt-1.5 text-sm text-gray-700">${{ product.price }}</p>
                </div>
            </a>
{% endblock %}
