{% extends "base.html" %}
{%  block header %}
{% endblock %}
{% block content %}
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-2xl font-semibold mb-6 text-center">Formulario de Pago</h1>
        <form id="payment-form" method="post" action="" class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_card_number" class="block text-sm font-medium text-gray-700">Número de Tarjeta</label>
                {{ form.card_number }}
            </div>
            <div class="mb-4">
                <label for="id_expiry_month" class="block text-sm font-medium text-gray-700">Mes de Expiración</label>
                {{ form.expiry_month }}
            </div>
            <div class="mb-4">
                <label for="id_expiry_year" class="block text-sm font-medium text-gray-700">Año de Expiración</label>
                {{ form.expiry_year }}
            </div>
            <div class="mb-4">
                <label for="id_cvv" class="block text-sm font-medium text-gray-700">CVV</label>
                {{ form.cvv }}
            </div>
            <div>
                <button type="submit" class="w-full py-2 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Pagar
                </button>
            </div>
        </form>
    </div>
</body>
</html>


{% endblock %}
